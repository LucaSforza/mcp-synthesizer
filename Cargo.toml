[package]
name = "my-mcp-server"
version = "0.1.0"
edition = "2024"


[dependencies]
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", features = [
  "server",
  "transport-io",
  "macros",
] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
