[package]
name = "mcp_synth"
version = "0.1.0"
edition = "2024"


[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld", "-C", "target-feature=+crt-static"]

[dev-dependencies]
tempfile = "3"

[dependencies]
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", features = [
  "server",
  "transport-io",
  "macros",
] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
redis = { version = "0.27", features = ["tokio-comp"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "migrate"
path = "src/bin/migrate_sqlite_to_redis.rs"

[[bin]]
name = "queue_controller"
path = "src/bin/queue_controller.rs"
